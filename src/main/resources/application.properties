# Pinggy Tunnel (disabled)
pinggy.enabled=false

# H2 Database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/experiments;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=PhyExp@2026#Secure
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

# Error handling: never leak stacktrace/message in production
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

